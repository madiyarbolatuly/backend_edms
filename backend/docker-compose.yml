version: "3.9"

services:
  api:
    build: .
    # The stack serves the built frontend too (app/frontend/dist), so this
    # container going down takes the UI with it — bring it back on crash and
    # on host reboot.
    restart: unless-stopped
    depends_on: [postgres]
    ports: ["8000:8000"]
    env_file: app/.env
    volumes:
      - ./:/usr/src/app
      - /home/fanatik/madiyar/final/docedms/backend/uploads:/usr/src/app/uploads:rw
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LOCAL_STORAGE_PATH: /usr/src/app/uploads/1/1
    # The symlink loop that used to sit here was a workaround for the duplicated
    # storage prefix (paths stored as `1/1/…` under a LOCAL_STORAGE_PATH that
    # already ended in `/1/1`). It linked into /usr/src/app/uploads, which is
    # *outside* LOCAL_STORAGE_PATH, so nothing ever read through it. The prefix
    # is fixed at the source now — see app/scan/paths.py.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
      
  scanner:
    build: .
    command: python app/scan/scan_and_upload.py
    env_file: app/.env
    restart: "no"
    profiles: ["manual"]  
    environment:
      POSTGRES_HOST: postgres
      # Scan the whole tenant/department root so all folders (Projects-2024/2025/2026, etc.) become accessible.
      ROOT_SCAN: /usr/src/app/uploads/1/1
      # Empty: ROOT_SCAN *is* LOCAL_STORAGE_PATH, so stored paths are relative
      # to it. Setting this to "1/1" while LOCAL_STORAGE_PATH already ended in
      # /1/1 is what made every file resolve to uploads/1/1/1/1/… and 404.
      ROOT_PREFIX: ""
      TENANT_ID: "1"
      DEPARTMENT_ID: "1"
      OWNER_ID: "c17ba46f-b4b0-473c-ac93-cb10cfed0f7e"
      HASH_FILES: "false"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ./:/usr/src/app
      - /home/fanatik/madiyar/final/docedms/backend/uploads/1/1:/usr/src/app/uploads/1/1

  # Same scan as `scanner`, but running continuously: every SCAN_INTERVAL
  # seconds the storage root is re-indexed, so files added/renamed/removed on
  # disk show up in `documents` without anyone running the scan by hand.
  # Starts with the stack (no profile); one-off runs still go through `scanner`.
  scanner-cron:
    build: .
    command: python app/scan/scan_and_upload.py
    depends_on: [postgres]
    env_file: app/.env
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      SCAN_INTERVAL: "300"        # 5 минут; 0 — один проход и выход
      ROOT_SCAN: /usr/src/app/uploads/1/1
      ROOT_PREFIX: ""
      TENANT_ID: "1"
      DEPARTMENT_ID: "1"
      OWNER_ID: "c17ba46f-b4b0-473c-ac93-cb10cfed0f7e"
      # Hashing every file on every pass is the expensive part of a scan —
      # keep it off for the scheduled one.
      HASH_FILES: "false"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ./:/usr/src/app
      - /home/fanatik/madiyar/final/docedms/backend/uploads/1/1:/usr/src/app/uploads/1/1

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: app/.env
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:

