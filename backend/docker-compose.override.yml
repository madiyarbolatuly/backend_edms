services:
  api:
    build: .
    # Bind mounts
    volumes:
     - ./uploads:/usr/src/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  postgres:
    # existing data volume was initialized by PG17; match it to preserve data
    image: postgres:17
    ports:
      - "5432:5432"